site_name: Void_Liao 的博客
site_description: 学习笔记与工程记录，按集合组织
site_author: Void_Liao

site_url: https://symbii.github.io/
repo_url: https://github.com/Symbii/symbii.github.io
repo_name: Symbii/symbii.github.io
edit_uri: ""

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切到浅色

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang:
        - zh
        - en

# 导航由 blog/sync.py 生成：下面两行标记之间的内容每次同步都会重写，
# 所以新增 D03、D04 或新集合都不用手改配置。
# >>> NAV（由 blog/sync.py 生成，勿手改）
