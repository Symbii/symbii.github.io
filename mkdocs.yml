site_name: RAG 学习日志
site_description: 56 天从零手写一遍 RAG，每天一记
site_author: liaoxin

# 建好仓库后，把下面两行的 USERNAME 换成你的 GitHub 用户名
site_url: https://USERNAME.github.io/rag-study-blog/
repo_url: https://github.com/USERNAME/rag-study-blog
repo_name: rag-study-blog

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切到浅色

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang:
        - zh
        - en

# nav 故意不写：MkDocs 按目录自动生成，文件名已带序号，
# 新增 D03、D04 时不需要改配置。
