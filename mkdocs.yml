              - 论文精读: rag-study/D01/02-论文精读.md
              - 源码对照: rag-study/D01/03-源码对照.md
              - 复述与卡点: rag-study/D01/04-复述与卡点.md
              - 术语澄清-稠密向量索引: rag-study/D01/05-术语澄清-稠密向量索引.md
              - 打卡总结: rag-study/D01/06-打卡总结.md
              - 八环默写-本人版: rag-study/D01/07-八环默写-本人版.md
              - 链路图-AI绘制: rag-study/D01/08-链路图-AI绘制.md
